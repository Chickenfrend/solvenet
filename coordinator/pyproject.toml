[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solvenet-coordinator"
version = "0.1.0"
description = "Coordinator components for SolveNet"
requires-python = ">=3.11"

[project.scripts]
solvenet-verify = "solvenet.verifier:main"
solvenet-coordinator = "solvenet.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
