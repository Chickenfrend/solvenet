[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solvenet-homelab"
version = "0.1.0"
description = "Private SolveNet homelab site"
requires-python = ">=3.11"

[project.scripts]
solvenet-homelab = "solvenet_homelab.server:main"

[tool.setuptools.package-data]
solvenet_homelab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
